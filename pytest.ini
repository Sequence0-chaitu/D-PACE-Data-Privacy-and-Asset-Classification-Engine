[pytest]
# Without this, a bare `pytest tests/` cannot import `dpace`: pytest puts the
# test file's own directory on sys.path, not the project root, so every
# `from dpace.scanner...` import fails with ModuleNotFoundError.
pythonpath = .
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*
